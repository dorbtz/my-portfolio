name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: lint · typecheck · vitest · build · bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint (block any new errors or warnings)
        # Round 74: --max-warnings 0 turns the existing 27→0 cleanup
        # into a hard CI gate so regressions don't sneak in.
        run: npx eslint . --max-warnings 0

      - name: TypeScript noEmit check
        run: npx tsc --noEmit

      - name: Vitest (run mode)
        run: npx vitest run --reporter=dot

      - name: Production build
        run: npx vite build

      - name: Bundle size check
        # Raw KB ceilings (gzip is roughly 1/3.5 of raw, so 900 KB raw ≈ 260 KB gz
        # for the largest entry chunk; index CSS raw 260 KB ≈ 70 KB gz). These are
        # generous backstops above the project's tighter local targets so CI
        # fails when something balloons but doesn't trip on every minor diff.
        run: |
          set -euo pipefail
          # Find the largest JS chunk in dist/assets and the index CSS file.
          LARGEST_JS=$(ls -1S dist/assets/*.js | head -1)
          INDEX_CSS=$(ls -1 dist/assets/index-*.css | head -1)
          JS_SIZE=$(stat -c%s "$LARGEST_JS")
          CSS_SIZE=$(stat -c%s "$INDEX_CSS")
          echo "Largest JS: $LARGEST_JS = $JS_SIZE bytes"
          echo "Index CSS:  $INDEX_CSS = $CSS_SIZE bytes"
          test $JS_SIZE  -lt 900000
          test $CSS_SIZE -lt 260000
