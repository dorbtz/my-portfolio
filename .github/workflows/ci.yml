name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: lint · typecheck · vitest · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm install` (not `npm ci`) so a slightly-out-of-sync lock file
      # — e.g. platform-specific optional deps like @emnapi that weren't
      # serialised correctly into packages[] on Windows — doesn't block
      # the build. Vercel uses `npm install` too, so this matches prod.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: ESLint (block any new errors or warnings)
        run: npm run lint -- --max-warnings 0

      - name: TypeScript noEmit check
        run: npm run typecheck

      - name: Vitest (run mode)
        run: npm test

      - name: Next.js production build
        run: npm run build
        env:
          # Build-time env-var stand-ins so `next build` doesn't fail on
          # missing real values during CI (the actual values live in
          # Vercel for production). Anything client-public has a real
          # placeholder; server-only secrets get blank stand-ins that
          # client code never reads.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role' }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || 'placeholder-google-key' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'placeholder-cron-secret' }}
